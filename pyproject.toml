[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectready"
version = "0.1.0"
description = "Read-only Python project readiness diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["packaging>=23"]

[project.scripts]
projectready = "projectready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
